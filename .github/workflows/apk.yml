name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk Desenchufe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Desenchufe
          path: Desenchufe.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Desenchufe.apk \
            --title "Desenchufe · versión ${{ github.run_number }}" \
            --notes "Bajá Desenchufe.apk desde el celu e instalalo. Si ya tenés una versión anterior, se actualiza encima sin perder datos." \
            --latest
